<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PayPal Payment Demo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 500px;
            width: 90%;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 2.5rem;
        }

        .subtitle {
            color: #666;
            margin-bottom: 40px;
            font-size: 1.1rem;
        }

        .payment-form {
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 25px;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }

        .amount-input {
            width: 100%;
            padding: 15px;
            font-size: 1.2rem;
            border: 2px solid #e1e5e9;
            border-radius: 10px;
            transition: border-color 0.3s ease;
        }

        .amount-input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .currency {
            background: #f8f9fa;
            color: #666;
            padding: 15px;
            border: 2px solid #e1e5e9;
            border-left: none;
            border-radius: 0 10px 10px 0;
            font-weight: 600;
        }

        .input-group {
            display: flex;
        }

        .input-group .amount-input {
            border-radius: 10px 0 0 10px;
        }

        .pay-button {
            background: linear-gradient(45deg, #0070ba, #005ea6);
            color: white;
            padding: 15px 40px;
            font-size: 1.2rem;
            font-weight: 600;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
            margin-top: 20px;
        }

        .pay-button:hover {
            background: linear-gradient(45deg, #005ea6, #004494);
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0, 112, 186, 0.3);
        }

        .pay-button:active {
            transform: translateY(0);
        }

        .paypal-logo {
            width: 150px;
            margin-bottom: 20px;
        }

        .security-badge {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 10px;
            margin-top: 30px;
            border-left: 4px solid #28a745;
        }

        .security-text {
            color: #666;
            font-size: 0.9rem;
        }

        .quick-amounts {
            display: flex;
            gap: 10px;
            margin-top: 15px;
            flex-wrap: wrap;
        }

        .quick-amount {
            background: #f8f9fa;
            border: 2px solid #e1e5e9;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 500;
        }

        .quick-amount:hover {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        @media (max-width: 480px) {
            .container {
                padding: 30px 20px;
            }
            
            h1 {
                font-size: 2rem;
            }
            
            .quick-amounts {
                justify-content: center;
            }
        }
    </style>
</head>

        <h1>PayPal Payment</h1>
        <p class="subtitle">Secure and easy online payments</p>
        
        <form action="/paypal/pay" method="post" class="payment-form">
            <div class="form-group">
                <label for="amount">Enter Payment Amount:</label>
                <div class="input-group">
                    <input type="number" 
                           id="amount" 
                           name="amount" 
                           class="amount-input" 
                           step="0.01" 
                           min="0.01" 
                           placeholder="0.00" 
                           required>
                    <div class="currency">USD</div>
                </div>
                <div class="quick-amounts">
                    <span class="quick-amount" onclick="setAmount(10)">$10</span>
                    <span class="quick-amount" onclick="setAmount(25)">$25</span>
                    <span class="quick-amount" onclick="setAmount(50)">$50</span>
                    <span class="quick-amount" onclick="setAmount(100)">$100</span>
                </div>
            </div>
            
            <button type="submit" class="pay-button">
                Pay with PayPal
            </button>
        </form>
        
        <div class="security-badge">
            <div class="security-text">
                🔒 Your payment information is secure and encrypted
            </div>
        </div>
    </div>

    <script>
        function setAmount(amount) {
            document.getElementById('amount').value = amount.toFixed(2);
            
            // Add visual feedback
            document.querySelectorAll('.quick-amount').forEach(btn => {
                btn.style.background = '#f8f9fa';
                btn.style.color = '#333';
                btn.style.borderColor = '#e1e5e9';
            });
            
            event.target.style.background = '#667eea';
            event.target.style.color = 'white';
            event.target.style.borderColor = '#667eea';
        }

        // Form validation
        document.querySelector('.payment-form').addEventListener('submit', function(e) {
            const amount = parseFloat(document.getElementById('amount').value);
            
            if (!amount || amount < 0.01) {
                e.preventDefault();
                alert('Please enter a valid amount (minimum $0.01)');
                return;
            }
            
            if (amount > 10000) {
                e.preventDefault();
                alert('Maximum amount is $10,000');
                return;
            }
            
            // Show loading state
            const button = document.querySelector('.pay-button');
            button.innerHTML = 'Processing...';
            button.disabled = true;
        });

        // Auto-format amount input
        document.getElementById('amount').addEventListener('input', function(e) {
            let value = e.target.value;
            if (value.includes('.')) {
                let parts = value.split('.');
                if (parts[1] && parts[1].length > 2) {
                    e.target.value = parts[0] + '.' + parts[1].substring(0, 2);
                }
            }
        });
    </script>
</body>
</html>
